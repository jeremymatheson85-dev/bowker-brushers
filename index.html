<title>Bowker Brushers</title>

<style>
:root { --mint:#40CAA4; --ink:#1F2A37; --muted:#5B6675; --paper:#F6F7FA; --card:#fff; --line:#E3E7EE; }
@media (prefers-color-scheme: dark) { :root { --ink:#E8ECF2; --muted:#A3ADBB; --paper:#12161C; --card:#1A2029; --line:#2A323E; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
header { display:flex; align-items:center; gap:14px; margin-bottom:24px; }
header img { width:56px; height:56px; border-radius:13px; }
header a { color:inherit; text-decoration:none; font-weight:800; font-size:20px; }
.card { background:var(--card); border-radius:20px; padding:24px; box-shadow:0 10px 30px rgba(20,30,50,.06); }
h1 { font-size:30px; line-height:1.2; margin:0 0 8px; }
h2 { font-size:21px; margin:32px 0 8px; }
a { color:var(--mint); }
.table { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:15px; }
th, td { text-align:left; vertical-align:top; padding:10px 8px; border-bottom:1px solid var(--line); }
th { color:var(--muted); font-weight:600; }
footer { color:var(--muted); font-size:14px; margin-top:24px; }

<header><img src="/bowker-brushers/icon.png" alt=""><a href="/bowker-brushers/">Bowker Brushers</a></header>

<p>Two minutes, twice a day, made fun. A toothbrushing game for kids aged 3 to 8, with a buddy who shows them
where to brush next and a kingdom to explore one brush at a time.</p>
<p>No ads, no purchases, no tracking.</p>
